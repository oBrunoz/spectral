<button
  type="button"
  (click)="selected.emit(actor.id)"
  class="w-full text-left bg-[#1a1a1a] rounded-lg overflow-hidden flex flex-col h-full transition duration-300 hover:bg-[#242424] focus-visible:ring-2 focus-visible:ring-white/40 outline-none"
  [attr.aria-label]="'Ver detalhes de ' + actor.name">
  <img
    [src]="actor.profileUrl"
    [alt]="actor.name"
    class="w-full aspect-[2/3] object-cover bg-[#242424]"
  />
  <div class="p-4 flex-1 flex flex-col justify-center">
    <h3 class="text-white font-bold text-sm text-center leading-tight mb-1">{{ actor.name }}</h3>
    <p class="text-gray-400 text-xs text-center leading-tight">{{ actor.character }}</p>
  </div>
</button>
