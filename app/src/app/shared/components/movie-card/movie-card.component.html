<a [routerLink]="detailsRoute"
  class="group block rounded-xl overflow-hidden bg-[#1a1a1a] shadow-lg h-full">

  <div class="aspect-[2/3] relative overflow-hidden">
    @if (posterUrl) {
      <img
        [src]="posterUrl"
        [alt]="title"
        class="object-cover w-full h-full transition duration-500 group-hover:scale-105"
        loading="lazy"
      />
    } @else {
      <app-media-fallback [label]="title"></app-media-fallback>
    }

    <!-- escurece e revela as informações no hover -->
    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-black/10 opacity-0 group-hover:opacity-100 transition duration-300"></div>

    <div class="absolute inset-x-0 bottom-0 p-3 opacity-0 translate-y-3 group-hover:opacity-100 group-hover:translate-y-0 transition duration-300">
      @if (resolvedGenres.length > 0) {
        <div class="flex flex-wrap gap-1 mb-2">
          @for (genre of resolvedGenres.slice(0, 2); track genre) {
            <span class="text-[10px] bg-white/15 text-gray-200 px-2 py-0.5 rounded-full">{{ genre }}</span>
          }
        </div>
      }
      @if (overview) {
        <p class="text-gray-300 text-[11px] leading-relaxed line-clamp-3">{{ overview }}</p>
      }
    </div>
  </div>

  <div class="p-3">
    <h3 class="text-white font-semibold text-sm truncate group-hover:text-red-500 transition duration-300">{{ title }}</h3>
    <div class="flex items-center mt-1">
      <span class="text-gray-400 text-xs">{{ year }}</span>
      @if (rating > 0) {
        <span class="ml-auto bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded text-xs font-medium flex items-center gap-1">
          <svg lucideStar [size]="11" strokeWidth="2" fill="currentColor"></svg>
          {{ rating.toFixed(1) }}
        </span>
      }
    </div>
  </div>
</a>
