<div
  class="w-full h-full bg-[#1a1a1a] flex flex-col items-center justify-center gap-3 p-3 text-center select-none">
  <span class="text-white/15">
    @switch (kind) {
      @case ('person') {
        <svg lucideUser [size]="compact ? 18 : 40" strokeWidth="1.5"></svg>
      }
      @case ('logo') {
        <svg lucideImage [size]="compact ? 18 : 40" strokeWidth="1.5"></svg>
      }
      @default {
        <svg lucideClapperboard [size]="compact ? 18 : 40" strokeWidth="1.5"></svg>
      }
    }
  </span>

  @if (label && !compact) {
    <p class="text-gray-500 text-xs leading-tight line-clamp-3">{{ label }}</p>
  }
</div>
