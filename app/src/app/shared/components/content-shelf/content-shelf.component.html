<!-- a prateleira some por inteiro quando a consulta não devolve nada -->
@if (isLoading() || items().length > 0) {
  <section class="px-20 mb-16">
    <h2 class="font-bold text-white" [ngClass]="large ? 'text-3xl mb-8' : 'text-2xl mb-6'">{{ title }}</h2>

    @if (isLoading()) {
      <div class="flex gap-4 overflow-hidden">
        @for (item of skeletonItems; track $index) {
          <div class="flex-none w-60 rounded-xl overflow-hidden shadow-lg">
            <div class="aspect-[2/3] skeleton bg-[#1a1a1a]"></div>
            <div class="p-3 bg-[#1a1a1a]">
              <div class="h-4 skeleton bg-[#242424] rounded mb-2"></div>
              <div class="h-3 skeleton bg-[#242424] rounded w-2/3"></div>
            </div>
          </div>
        }
      </div>
      <div class="h-2 mt-3"></div>
    } @else {
      <app-carousel-row>
        @for (item of items(); track item.id) {
          <div class="flex-none w-60 snap-start">
            <app-movie-card
              [id]="item.id"
              [title]="getTitle(item)"
              [posterPath]="item.poster_path"
              [backdropPath]="item.backdrop_path"
              [year]="getYear(item)"
              [rating]="item.vote_average"
              [overview]="item.overview"
              [genreIds]="item.genre_ids ?? []"
              [mediaType]="mediaType">
            </app-movie-card>
          </div>
        }
      </app-carousel-row>
    }
  </section>
}
