<!--
  Uma única fita de listras anos 70 (violeta → carmim) atravessando a página.
  As cores já vêm envelhecidas (sepia 0.18 + saturate 0.92 aplicados no hex);
  um filter CSS tingiria também a faixa de corte e ela apareceria.

  O viewBox é "percentual": 100 unidades de largura, 1000 de altura, esticado
  para o tamanho do documento com preserveAspectRatio="none". Como os traços
  usam vector-effect="non-scaling-stroke", a espessura fica travada em px de tela
  independentemente do quanto a página estica — o que permite ancorar cada
  curva a uma região da página (y=200 é sempre a área das listas, y=560 é
  sempre o CTA) sem nenhum JavaScript.

  As faixas são o mesmo traçado deslocado no eixo X (via --i, no CSS), coladas
  umas nas outras como as listras dos anos 70: a espessura em vw acompanha o
  deslocamento em % de largura, então não sobra vão entre elas em nenhuma tela.
  Cada faixa cobre a sobra da anterior; nas diagonais elas afinam um pouco,
  o que mantém a leitura de fita única.
-->

  class="ribbon"
  viewBox="0 0 100 1800"
  preserveAspectRatio="none"
  fill="none"
  aria-hidden="true">

  <g stroke-linecap="round">

    <!-- VIOLETA -->
    <path
      class="wire" style="--i: 0"
      stroke="#45417c"
      vector-effect="non-scaling-stroke"
      d="
        M 50 -80
        C 50 40, 52 100, 62 180
        C 72 260, 88 300, 86 380
        C 84 470, 65 520, 45 590
        C 25 660, 12 720, 18 800
