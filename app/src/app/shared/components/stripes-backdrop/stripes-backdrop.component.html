<!--
  Uma única fita de 4 fios atravessando a página inteira.

  O viewBox é "percentual": 100 unidades de largura, 1000 de altura, esticado
  para o tamanho do documento com preserveAspectRatio="none". Como os traços
  usam vector-effect="non-scaling-stroke", a espessura fica travada em px de tela
  independentemente do quanto a página estica — o que permite ancorar cada
  curva a uma região da página (y=200 é sempre a área das listas, y=560 é
  sempre o CTA) sem nenhum JavaScript.

  Os fios são o mesmo traçado deslocado no eixo X. Como a trajetória é
  predominantemente vertical, o deslocamento horizontal mantém o paralelismo
  visual e ainda aperta o feixe em telas estreitas, onde ele deve pesar menos.
-->
<svg
  class="ribbon"
  viewBox="0 0 100 1800"
  preserveAspectRatio="none"
  fill="none"
  aria-hidden="true">

  <g
    stroke-width="8"
    stroke-linecap="round"
    vector-effect="non-scaling-stroke">

    <!-- RED -->
    <path
      class="wire wire--1"
      stroke="#e50914"
      vector-effect="non-scaling-stroke"
      d="
        M 50 -80
        C 50 40, 52 100, 62 180
        C 72 260, 88 300, 86 380
        C 84 470, 65 520, 45 590
        C 25 660, 12 720, 18 800
        C 24 880, 48 920, 67 990
        C 84 1055, 86 1110, 70 1180
        C 54 1250, 28 1290, 22 1360
        C 15 1440, 32 1495, 50 1560
        C 65 1615, 66 1670, 56 1740
        C 53 1765, 51 1790, 50 1880
      " />

    <!-- YELLOW -->
    <path
      class="wire wire--2"
      stroke="#ffd166"
      vector-effect="non-scaling-stroke"
      transform="translate(1.5 0)"
      d="
        M 50 -80
        C 50 40, 52 100, 62 180
        C 72 260, 88 300, 86 380
        C 84 470, 65 520, 45 590
        C 25 660, 12 720, 18 800
        C 24 880, 48 920, 67 990
        C 84 1055, 86 1110, 70 1180
        C 54 1250, 28 1290, 22 1360
        C 15 1440, 32 1495, 50 1560
        C 65 1615, 66 1670, 56 1740
        C 53 1765, 51 1790, 50 1880
      " />

    <!-- GREEN -->
    <path
      class="wire wire--3"
      stroke="#06d6a0"
      vector-effect="non-scaling-stroke"
      transform="translate(3 0)"
      d="
        M 50 -80
        C 50 40, 52 100, 62 180
        C 72 260, 88 300, 86 380
        C 84 470, 65 520, 45 590
        C 25 660, 12 720, 18 800
        C 24 880, 48 920, 67 990
        C 84 1055, 86 1110, 70 1180
        C 54 1250, 28 1290, 22 1360
        C 15 1440, 32 1495, 50 1560
        C 65 1615, 66 1670, 56 1740
        C 53 1765, 51 1790, 50 1880
      " />

    <!-- CYAN -->
    <path
      class="wire wire--4"
      stroke="#4cc9f0"
      vector-effect="non-scaling-stroke"
      transform="translate(4.5 0)"
      d="
        M 50 -80
        C 50 40, 52 100, 62 180
        C 72 260, 88 300, 86 380
        C 84 470, 65 520, 45 590
        C 25 660, 12 720, 18 800
        C 24 880, 48 920, 67 990
        C 84 1055, 86 1110, 70 1180
        C 54 1250, 28 1290, 22 1360
        C 15 1440, 32 1495, 50 1560
        C 65 1615, 66 1670, 56 1740
        C 53 1765, 51 1790, 50 1880
      " />

  </g>
</svg>
