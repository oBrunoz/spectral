<div class="relative min-h-screen flex flex-col">
  <!-- Background -->
  <div class="absolute inset-0 w-full h-full">
    <div class="absolute inset-0 bg-black opacity-80 z-10"></div>
    <img
      src="https://image.tmdb.org/t/p/original/rr7E0NoGKxvbkb89eR1GwfoYjpA.jpg"
      alt="Background"
      class="absolute object-cover w-full h-full"
    />
  </div>

  <div class="container mx-auto px-4 sm:px-6 relative z-20 flex-grow flex items-center justify-center py-16 sm:py-20">
    <div class="bg-gray-900/90 p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-sm sm:max-w-md">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-white">Criar conta</h1>
        <p class="text-sm text-gray-400 mt-2">Comece a acompanhar seus filmes favoritos</p>
      </div>

      <form class="space-y-5" (ngSubmit)="onSubmit()">
        <!-- Name -->
        <div>
          <label for="name" class="block text-sm text-gray-300 mb-2">Nome</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg lucideUser [size]="16" strokeWidth="1.75" class="text-gray-500"></svg>
            </div>
            <input
              type="text"
              id="name"
              [ngModel]="name()"
              (ngModelChange)="name.set($event)"
              name="name"
              class="bg-gray-800 text-white placeholder-gray-500 pl-10 pr-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 w-full"
              placeholder="Seu nome"
              required
            />
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm text-gray-300 mb-2">E-mail</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg lucideMail [size]="16" strokeWidth="1.75" class="text-gray-500"></svg>
            </div>
            <input
              type="email"
              id="email"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              name="email"
              class="bg-gray-800 text-white placeholder-gray-500 pl-10 pr-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 w-full"
              placeholder="voce@email.com"
              required
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm text-gray-300 mb-2">Senha</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg lucideLock [size]="16" strokeWidth="1.75" class="text-gray-500"></svg>
            </div>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              class="bg-gray-800 text-white placeholder-gray-500 pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 w-full"
              placeholder="••••••••"
              required
            />
            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
              <button type="button" (click)="togglePassword()" class="text-gray-500 hover:text-gray-300">
                @if (showPassword()) {
                  <svg lucideEyeOff [size]="16" strokeWidth="1.75"></svg>
                } @else {
                  <svg lucideEye [size]="16" strokeWidth="1.75"></svg>
                }
              </button>
            </div>
          </div>
        </div>

        @if (erro()) {
          <p class="text-sm text-red-400">{{ erro() }}</p>
        }

        <button
          type="submit"
          [disabled]="enviando()"
          class="w-full cursor-pointer bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition duration-300 text-base font-semibold disabled:opacity-60 disabled:cursor-not-allowed">
          {{ enviando() ? 'Criando...' : 'Criar conta' }}
        </button>
      </form>

      <p class="text-center mt-8 text-sm text-gray-400">
        Já tem uma conta?
        <a routerLink="/login" queryParamsHandling="preserve" class="text-red-500 hover:text-red-400 font-medium">Entrar</a>
      </p>
    </div>
  </div>
</div>
