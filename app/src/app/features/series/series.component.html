<main class="min-h-screen pt-20 pb-16">
  <section class="container mx-auto px-6">
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-3xl font-bold text-white">Séries em alta esta semana</h2>
    </div>

    @if (isLoading()) {
      <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
        @for (item of skeletonItems; track $index) {
          <div class="bg-gray-800 rounded-lg overflow-hidden shadow-lg">
            <div class="aspect-[2/3] bg-gray-700 animate-pulse"></div>
            <div class="p-4">
              <div class="h-5 bg-gray-700 rounded animate-pulse mb-2"></div>
              <div class="h-4 bg-gray-700 rounded animate-pulse w-2/3"></div>
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
        @for (show of shows(); track show.id) {
          <app-movie-card
            [id]="show.id"
            [title]="show.name"
            [posterPath]="show.poster_path"
            [year]="getShowYear(show)"
            [rating]="show.vote_average"
            mediaType="series">
          </app-movie-card>
        }
      </div>
    }
  </section>
</main>
